version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: crypto_evaluator_postgres
    environment:
      POSTGRES_DB: crypto_evaluator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: crypto_evaluator_redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  postgres_data:
